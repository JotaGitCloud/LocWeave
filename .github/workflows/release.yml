name: Release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas
        run: python -m unittest discover -s tests
      - name: Crear ejecutable
        run: pyinstaller LocWeave.spec --noconfirm
      - name: Comprimir
        run: Compress-Archive -Path dist/LocWeave -DestinationPath LocWeave-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LocWeave-windows
          path: LocWeave-windows.zip
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LocWeave-windows.zip
