name: Release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Informe de dependencias instaladas
        shell: pwsh
        run: |
          $purelib = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $rows = Get-ChildItem $purelib -Directory | ForEach-Object {
            $bytes = (Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            [pscustomobject]@{ Paquete = $_.Name; MB = [math]::Round($bytes / 1MB, 1) }
          } | Sort-Object MB -Descending | Select-Object -First 15
          "## Dependencias instaladas (las 15 más pesadas)" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          ($rows | Format-Table -AutoSize | Out-String) | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          $torch = if (Test-Path (Join-Path $purelib "torch")) { "SÍ" } else { "no" }
          "PyTorch instalado: **$torch**" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Pruebas
        run: python -m unittest discover -s tests

      - name: Crear ejecutable
        run: pyinstaller LocWeave.spec --noconfirm --clean

      - name: Autoprueba del ejecutable
        id: selftest
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\LocWeave\LocWeave.exe" -ArgumentList "--selftest", $out -Wait -PassThru
          if (Test-Path $out) { Get-Content $out; Get-Content $out | Add-Content $env:GITHUB_STEP_SUMMARY }
          if ($p.ExitCode -ne 0) { throw "La autoprueba del ejecutable falló (código $($p.ExitCode))" }

      - name: Comprimir (zip)
        shell: pwsh
        run: 7z a -tzip -mx=9 LocWeave-windows.zip .\dist\LocWeave | Out-Null

      - name: Crear instalador (Setup.exe)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.1.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\LocWeave.iss
          if (Test-Path installer_out\LocWeave-Setup.exe) { Move-Item installer_out\LocWeave-Setup.exe LocWeave-Setup.exe }

      - name: Informe de tamaños
        if: always()
        shell: pwsh
        run: |
          function MB($path) { [math]::Round(((Get-ChildItem $path -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum) / 1MB, 1) }
          $s = $env:GITHUB_STEP_SUMMARY
          "## Tamaños de LocWeave" | Add-Content $s
          if (Test-Path dist\LocWeave) { "- App descomprimida: **$(MB 'dist\LocWeave') MB**" | Add-Content $s }
          if (Test-Path LocWeave-windows.zip) { "- LocWeave-windows.zip: **$([math]::Round((Get-Item LocWeave-windows.zip).Length / 1MB, 1)) MB**" | Add-Content $s }
          if (Test-Path LocWeave-Setup.exe) { "- LocWeave-Setup.exe: **$([math]::Round((Get-Item LocWeave-Setup.exe).Length / 1MB, 1)) MB**" | Add-Content $s }
          else { "- LocWeave-Setup.exe: no se generó (el zip sí está disponible)" | Add-Content $s }
          if (Test-Path dist\LocWeave) {
            $rows = Get-ChildItem dist\LocWeave -Recurse -Directory | Where-Object { $_.FullName.Split("\").Count -le ((Resolve-Path dist\LocWeave).Path.Split("\").Count + 2) } | ForEach-Object {
              [pscustomobject]@{ Carpeta = $_.FullName.Replace((Resolve-Path dist\LocWeave).Path, ""); MB = MB $_.FullName }
            } | Sort-Object MB -Descending | Select-Object -First 15
            "### Lo más pesado dentro de la app" | Add-Content $s
            '```' | Add-Content $s
            ($rows | Format-Table -AutoSize | Out-String) | Add-Content $s
            '```' | Add-Content $s
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocWeave-windows
          path: |
            LocWeave-windows.zip
            LocWeave-Setup.exe
          if-no-files-found: warn

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LocWeave-windows.zip
            LocWeave-Setup.exe
