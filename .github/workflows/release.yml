name: Release (Windows)

on:
  push:
    branches: ["qt-migration"]   # compila en cada subida a esta rama (solo genera archivos descargables)
    tags: ["v*"]                 # una etiqueta v* además publica el Release
  workflow_dispatch:             # botón «Run workflow»: publica un Release con versión automática

permissions:
  contents: write

jobs:
  prep:
    name: versión
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      # Se publica un Release solo si: (a) se sube una etiqueta v*, (b) el mensaje del commit contiene [release],
      # o (c) se pulsa «Run workflow». La versión de (b) y (c) sube sola: 0.1.0-beta.<número de ejecución>.
      - id: v
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          tag=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [[ "$MSG" == *"[release]"* ]]; then
            tag="v0.1.0-beta.${{ github.run_number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Etiqueta de publicación: '${tag:-(ninguna)}'"

  build:
    name: build (${{ matrix.variant }})
    needs: prep
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full    # con PyTorch
            slim: "0"
          - variant: slim    # sin PyTorch (mucho más liviana)
            slim: "1"
    env:
      LOCWEAVE_SLIM: ${{ matrix.slim }}
      RELEASE_TAG: ${{ needs.prep.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Informe de dependencias instaladas
        if: matrix.variant == 'full'
        shell: pwsh
        run: |
          $purelib = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $rows = Get-ChildItem $purelib -Directory | ForEach-Object {
            $bytes = (Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            [pscustomobject]@{ Paquete = $_.Name; MB = [math]::Round($bytes / 1MB, 1) }
          } | Sort-Object MB -Descending | Select-Object -First 15
          "## Dependencias instaladas (las 15 más pesadas)" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          ($rows | Format-Table -AutoSize | Out-String) | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Importación sin congelar (diagnóstico)
        continue-on-error: true
        shell: pwsh
        run: |
          $r = python -c "import sentencepiece, argostranslate.package, argostranslate.translate; print('OK')" 2>&1 | Out-String
          "## [${{ matrix.variant }}] Importación de Argos sin congelar" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          $r | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw "La importación de Argos falla incluso sin congelar" }

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      - name: Fijar versión de la aplicación
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $v = $env:RELEASE_TAG.TrimStart("v")
          (Get-Content app/config.py) -replace 'APP_VERSION = ".*?"', "APP_VERSION = `"$v`"" | Set-Content app/config.py
          Select-String -Path app/config.py -Pattern APP_VERSION

      - name: Crear ejecutable
        run: pyinstaller LocWeave.spec --noconfirm --clean

      - name: Autoprueba del ejecutable (incluye traducción real)
        id: selftest
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $shots = Join-Path $env:RUNNER_TEMP "shots"
          $p = Start-Process -FilePath "dist\LocWeave\LocWeave.exe" -ArgumentList "--selftest", $out, "--real", "--screenshots", $shots -Wait -PassThru
          "## [${{ matrix.variant }}] Autoprueba del ejecutable" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path $out) { Get-Content $out; Get-Content $out | Add-Content $env:GITHUB_STEP_SUMMARY }
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($p.ExitCode -ne 0) { throw "La autoprueba del ejecutable falló (código $($p.ExitCode))" }

      - name: Capturas de la interfaz (en el registro, para revisión)
        if: always() && matrix.variant == 'slim'
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "shots"
          if (Test-Path $dir) {
            Get-ChildItem $dir -Filter *.png | ForEach-Object {
              "SHOT|$($_.Name)|" + [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            }
          }

      - name: Diagnóstico de DLL faltantes
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $r = python tools/diag_dlls.py dist\LocWeave\_internal sentencepiece ctranslate2 onnxruntime 2>&1 | Out-String
          "## [${{ matrix.variant }}] DLL faltantes" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          $r | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Comprimir (zip)
        shell: pwsh
        run: 7z a -tzip -mx=9 "LocWeave-windows-${{ matrix.variant }}.zip" .\dist\LocWeave | Out-Null

      - name: Crear instalador (Setup.exe)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG.TrimStart("v") } else { "0.1.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\LocWeave.iss
          if (Test-Path installer_out\LocWeave-Setup.exe) { Move-Item installer_out\LocWeave-Setup.exe "LocWeave-Setup-${{ matrix.variant }}.exe" }

      - name: Informe de tamaños
        if: always()
        shell: pwsh
        run: |
          function MB($path) { [math]::Round(((Get-ChildItem $path -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum) / 1MB, 1) }
          $v = "${{ matrix.variant }}"
          $s = $env:GITHUB_STEP_SUMMARY
          "## [$v] Tamaños de LocWeave" | Add-Content $s
          if (Test-Path dist\LocWeave) { "- App descomprimida: **$(MB 'dist\LocWeave') MB**" | Add-Content $s }
          if (Test-Path "LocWeave-windows-$v.zip") { "- LocWeave-windows-$v.zip: **$([math]::Round((Get-Item "LocWeave-windows-$v.zip").Length / 1MB, 1)) MB**" | Add-Content $s }
          if (Test-Path "LocWeave-Setup-$v.exe") { "- LocWeave-Setup-$v.exe: **$([math]::Round((Get-Item "LocWeave-Setup-$v.exe").Length / 1MB, 1)) MB**" | Add-Content $s }
          else { "- LocWeave-Setup-$v.exe: no se generó (el zip sí está disponible)" | Add-Content $s }
          if (Test-Path dist\LocWeave) {
            $base = (Resolve-Path dist\LocWeave).Path
            $rows = Get-ChildItem dist\LocWeave -Recurse -Directory | Where-Object { $_.FullName.Split("\").Count -le ($base.Split("\").Count + 2) } | ForEach-Object {
              [pscustomobject]@{ Carpeta = $_.FullName.Replace($base, ""); MB = MB $_.FullName }
            } | Sort-Object MB -Descending | Select-Object -First 12
            $files = Get-ChildItem dist\LocWeave -Recurse -File | Sort-Object Length -Descending | Select-Object -First 25 | ForEach-Object {
              [pscustomobject]@{ Archivo = $_.FullName.Replace($base, ""); MB = [math]::Round($_.Length / 1MB, 1) }
            }
            "### [$v] Los 25 archivos más pesados" | Add-Content $s
            '```' | Add-Content $s
            ($files | Format-Table -AutoSize | Out-String) | Add-Content $s
            '```' | Add-Content $s
            "### [$v] Lo más pesado dentro de la app" | Add-Content $s
            '```' | Add-Content $s
            ($rows | Format-Table -AutoSize | Out-String) | Add-Content $s
            '```' | Add-Content $s
          }
          Get-Content $s | Write-Host   # copia del informe en el registro del paso (legible también con gh)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocWeave-windows-${{ matrix.variant }}
          path: |
            LocWeave-windows-${{ matrix.variant }}.zip
            LocWeave-Setup-${{ matrix.variant }}.exe
          if-no-files-found: warn

      - name: Verificar autoprueba
        if: steps.selftest.outcome == 'failure'
        shell: pwsh
        run: throw "La autoprueba del ejecutable (${{ matrix.variant }}) falló, revisa el Summary."

  publish:
    name: publicar release
    needs: [prep, build]
    if: needs.prep.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-files
          merge-multiple: true
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(needs.prep.outputs.tag, '-') }}
          generate_release_notes: true
          body: ${{ github.event.head_commit.message }}
          files: |
            dist-files/LocWeave-windows-*.zip
            dist-files/LocWeave-Setup-*.exe
